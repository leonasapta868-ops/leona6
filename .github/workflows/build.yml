name: Build leona6 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-leona6:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "leona6.cpp" -o "leona6.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-leona6
          path: "leona6.exe"
